<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi — Cafe ARTISI Bakmie &amp; Coffee</title>
<meta name="theme-color" content="#094840">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/favicon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="artisi.css">
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
  <section class="clock" aria-live="off">
    <div class="clock-time" id="jam">--:--:--</div>
    <div class="clock-date" id="tanggal">&nbsp;</div>
    <div class="clock-shift">Pagi 09.00-17.00 &nbsp;|&nbsp; Sore 14.00-22.00</div>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <h2>Jadwal hari ini</h2>
  <p class="sub" style="margin:-6px 0 10px">Tap namamu untuk mulai absen.</p>
  <div id="list"><div class="empty">Memuat jadwal...</div></div>

  <section id="panel"></section>

  <details class="more" id="lain" hidden>
    <summary>Bukan jadwalku hari ini (tukar shift)</summary>
    <div id="listLain" class="people"></div>
  </details>

  <input type="file" id="cam" accept="image/*" capture="user" hidden>
</main>

<script src="config.js"></script>
<script>
renderTopbar("index.html");

let DATA = null;                 // data hari ini dari server
let SEL = null;                  // nama yang dipilih
let ST = { tipe: null, foto: null };   // pilihan keterangan + foto untuk absen yang sedang diisi
let BUSY = false;

const LABEL_TIPE = { masuk: "Hadir", izin: "Izin", sakit: "Sakit", pulang: "Pulang" };

/* ---------- Jam ---------- */
function tick() {
  const n = new Date();
  document.getElementById("jam").textContent = n.toLocaleTimeString("id-ID", {
    timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  }).replace(/\./g, ":");
  document.getElementById("tanggal").textContent = n.toLocaleDateString("id-ID", {
    timeZone: "Asia/Jakarta", weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
}
tick(); setInterval(tick, 1000);

/* ---------- Notifikasi ---------- */
function notice(tipe, judul, isi) {
  const el = document.getElementById("notice");
  el.className = "notice " + tipe;
  el.innerHTML = "<strong>" + esc(judul) + "</strong>" + esc(isi || "");
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function clearNotice() { const el = document.getElementById("notice"); el.className = "notice"; el.innerHTML = ""; }

/* ---------- Muat data ---------- */
async function load() {
  try {
    DATA = await api({ action: "hariini" });
    if (!DATA.ok) throw new Error(DATA.message);
    render();
  } catch (e) {
    document.getElementById("list").innerHTML = '<div class="empty">Jadwal gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.</div>';
  }
}

function stateHtml(p) {
  if (!p.ada) return '<span class="muted">Belum absen</span>';
  if (p.ket === "Izin" || p.ket === "Sakit") return '<span class="badge b-blue">' + esc(p.ket) + "</span>";
  const jam = p.pulang ? "Masuk " + jamPendek(p.masuk) + ", pulang " + jamPendek(p.pulang) : "Masuk " + jamPendek(p.masuk);
  return '<span class="badge ' + ketClass(p.ket) + '">' + esc(p.ket) + "</span> " + esc(jam);
}

function personBtn(p) {
  return '<button class="person" data-n="' + esc(p.nama) + '" aria-pressed="' + (SEL === p.nama) + '">' +
    '<span class="nm">' + esc(p.nama) + "</span>" +
    '<span class="st">' + stateHtml(p) + "</span></button>";
}

const GRUP = [
  { key: "Pagi",     cls: "g-pagi", judul: "Shift Pagi" },
  { key: "Seharian", cls: "g-full", judul: "Seharian (double shift)" },
  { key: "Sore",     cls: "g-sore", judul: "Shift Sore" }
];

function render() {
  const jadwal = DATA.people.filter(function (p) { return p.terjadwal; });
  const lain = DATA.people.filter(function (p) { return !p.terjadwal; });

  let html = "";
  GRUP.forEach(function (g) {
    const isi = jadwal.filter(function (p) { return p.shift === g.key; });
    if (!isi.length) return;
    html += '<section class="grp ' + g.cls + '"><div class="grp-h"><h3>' + g.judul + "</h3><span>" +
      esc(DATA.shiftInfo[g.key].label) + '</span></div><div class="people">' +
      isi.map(personBtn).join("") + "</div></section>";
  });
  document.getElementById("list").innerHTML = html || '<div class="empty">Tidak ada jadwal hari ini.</div>';

  const lainEl = document.getElementById("lain");
  lainEl.hidden = !lain.length;
  document.getElementById("listLain").innerHTML = lain.map(personBtn).join("");

  document.querySelectorAll(".person").forEach(function (b) {
    b.onclick = function () { pilihNama(b.dataset.n); };
  });
  renderPanel();
}

function pilihNama(nama) {
  if (SEL === nama) { document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "nearest" }); return; }
  SEL = nama;
  ST = { tipe: null, foto: null };
  clearNotice();
  render();
  document.getElementById("panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* ---------- Panel pengisian absen ---------- */
function renderPanel() {
  const el = document.getElementById("panel");
  if (!SEL) { el.innerHTML = ""; return; }
  const p = DATA.people.find(function (x) { return x.nama === SEL; });
  const shift = p.shift || (menitSekarangWIB() < 14 * 60 ? "Pagi" : "Sore");
  const info = DATA.shiftInfo[p.ada && p.shiftTercatat ? p.shiftTercatat : shift];
  const selesai = !!(p.ada && (p.pulang || p.ket === "Izin" || p.ket === "Sakit"));
  const sudahMasuk = !!(p.ada && p.masuk && !p.pulang);

  const meta = (p.terjadwal ? "Shift " + (p.shift === "Seharian" ? "seharian (double shift)" : p.shift.toLowerCase())
                            : "Di luar jadwal hari ini, dicatat sebagai shift " + shift.toLowerCase()) + " &middot; " + esc(info.label);

  let isi;
  if (selesai) {
    isi = '<p class="hint" style="font-size:14px">Absensimu hari ini sudah lengkap.</p>';
  } else {
    if (sudahMasuk) ST.tipe = "pulang";
    const opsi = sudahMasuk ? ["pulang"] : ["masuk", "izin", "sakit"];
    isi =
      '<div class="step"><div class="lbl">1. Keterangan</div><div class="seg" role="radiogroup" aria-label="Keterangan absen">' +
      opsi.map(function (t) {
        return '<button type="button" role="radio" data-t="' + t + '" aria-checked="' + (ST.tipe === t) + '">' + LABEL_TIPE[t] + "</button>";
      }).join("") + "</div></div>" +
      '<div class="step"><div class="lbl">2. Foto bukti <span class="sub" id="fotoHint"></span></div><div class="fotobox" id="fotoBox"></div></div>' +
      '<div class="step"><div class="lbl">3. Catatan <span class="sub" id="catHint"></span></div>' +
      '<textarea id="catatan" placeholder="Tulis keterangan di sini. Boleh diisi sebelum atau sesudah foto."></textarea></div>' +
      '<div class="inline-err" id="err" role="alert"></div>' +
      '<div class="actions"><button class="btn main" id="btnKirim" type="button">Kirim absen</button></div>' +
      '<p class="hint">Absen baru tersimpan setelah tombol Kirim absen ditekan.</p>';
  }

  el.innerHTML = '<div class="card panel"><div class="panel-top"><h3>' + esc(p.nama) + "</h3>" +
    '<button type="button" class="link" id="btnBatal">Tutup</button></div><div class="meta">' + meta + "</div>" + isi + "</div>";

  document.getElementById("btnBatal").onclick = function () { SEL = null; ST = { tipe: null, foto: null }; render(); };
  if (selesai) return;

  el.querySelectorAll(".seg button").forEach(function (b) {
    b.onclick = function () {
      ST.tipe = b.dataset.t;
      el.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-checked", x === b); });
      setErr(""); updateHints();
    };
  });
  document.getElementById("btnKirim").onclick = function () { kirim(p, shift); };
  updateFoto(); updateHints();
}

function updateHints() {
  const f = document.getElementById("fotoHint"), c = document.getElementById("catHint");
  if (!f) return;
  const t = ST.tipe;
  f.textContent = !t ? "" : (t === "masuk" || t === "pulang") ? "(wajib)" : "(opsional)";
  c.textContent = !t ? "" : (t === "izin" || t === "sakit") ? "(wajib)" : t === "pulang" ? "(wajib jika pulang sebelum shift selesai)" : "(opsional)";
}

function setErr(t) { const e = document.getElementById("err"); if (e) e.textContent = t; }

/* ---------- Foto ---------- */
function ambilFoto() {
  return new Promise(function (res) {
    const cam = document.getElementById("cam");
    cam.value = "";
    cam.onchange = function () { res(cam.files[0] || null); };
    cam.click();
  });
}

function kompres(file) {
  return new Promise(function (res, rej) {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      const maks = 640, sk = Math.min(1, maks / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * sk); c.height = Math.round(img.height * sk);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = function () { rej(new Error("Foto tidak bisa dibaca")); };
    img.src = url;
  });
}

function updateFoto() {
  const box = document.getElementById("fotoBox");
  if (!box) return;
  box.innerHTML = ST.foto
    ? '<img class="thumb" src="' + ST.foto + '" alt="Foto bukti yang dipilih"><div><div class="sub" style="margin-bottom:6px">Foto siap dikirim.</div><button type="button" class="btn small" id="btnFoto">Ganti foto</button></div>'
    : '<button type="button" class="btn" id="btnFoto">Ambil foto</button><span class="sub">Kamera depan akan terbuka.</span>';
  document.getElementById("btnFoto").onclick = async function () {
    const f = await ambilFoto();
    if (!f) return;
    try { ST.foto = await kompres(f); setErr(""); } catch (e) { setErr("Foto gagal diproses. Coba ambil foto lagi."); }
    updateFoto();
  };
}

/* ---------- Kirim ---------- */
async function kirim(p, shift) {
  if (BUSY) return;
  const catEl = document.getElementById("catatan");
  const catatan = catEl.value.trim();
  const t = ST.tipe;

  if (!t) { setErr("Pilih keterangan dulu: Hadir, Izin, atau Sakit."); return; }
  if ((t === "masuk" || t === "pulang") && !ST.foto) { setErr("Foto bukti wajib untuk absen " + LABEL_TIPE[t].toLowerCase() + ". Tekan Ambil foto."); return; }
  if ((t === "izin" || t === "sakit") && !catatan) { setErr("Catatan wajib diisi untuk " + t + "."); catEl.focus(); return; }
  if (t === "pulang") {
    const s = DATA.shiftInfo[p.shiftTercatat || shift];
    if (menitSekarangWIB() < s.selesai && !catatan) {
      const jamSelesai = String(Math.floor(s.selesai / 60)).padStart(2, "0") + "." + String(s.selesai % 60).padStart(2, "0");
      setErr("Kamu pulang sebelum shift selesai (" + jamSelesai + "). Tulis alasannya di catatan.");
      catEl.focus(); return;
    }
  }
  setErr("");

  BUSY = true;
  const btn = document.getElementById("btnKirim");
  btn.disabled = true; btn.textContent = "Menyimpan...";
  try {
    const r = await api(null, { action: "absen", nama: p.nama, tipe: t, catatan: catatan, foto: ST.foto });
    if (!r.ok) throw new Error(r.message);
    notice("ok", "Berhasil, " + p.nama, r.message);
    SEL = null; ST = { tipe: null, foto: null };
    await load();
  } catch (e) {
    setErr(e.message || "Absen belum tersimpan. Periksa koneksi, lalu coba lagi.");
    btn.disabled = false; btn.textContent = "Kirim absen";
  } finally {
    BUSY = false;
  }
}

load();
</script>
</body>
</html>
